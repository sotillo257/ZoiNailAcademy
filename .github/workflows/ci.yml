name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check for pending EF Core model changes
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          dotnet ef migrations has-pending-model-changes --project src/ZoiNailAcademy.Infrastructure --no-build --configuration Release

      - name: Unit tests
        run: dotnet test tests/UnitTests --no-build --configuration Release

      # ubuntu-latest runners ship with Docker, which Testcontainers uses to start PostgreSQL.
      - name: Integration tests
        run: dotnet test tests/IntegrationTests --no-build --configuration Release

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t zoinailacademy-backend:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    needs: web

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Development settings: seeded users admin@local.test / superadmin@local.test, cookie without Secure (http).
      - name: Start the API
        run: |
          dotnet build src/ZoiNailAcademy.Host --configuration Release
          ASPNETCORE_ENVIRONMENT=Development PORT=8080 nohup dotnet run --no-build --configuration Release \
            --project src/ZoiNailAcademy.Host --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/health && break; sleep 2; done

      - name: Build and start the web
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npm start -- -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/admin/login > /dev/null && break; sleep 2; done

      - name: E2E (Playwright, phone and desktop)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - if: failure()
        run: tail -n 200 api.log web.log

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results
